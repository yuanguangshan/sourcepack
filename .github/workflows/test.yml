name: test

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Go 1.21/1.22 hit dyld "missing LC_UUID load command" on macOS 15
        # runners (golang/go#69910), so the oldest tested version is 1.23
        # （go.mod 也据此声明 go 1.23）。
        go-version: ['1.23', '1.24', 'stable']
        # windows 必须有：v1.8.0 在 Windows 上完全装不上
        # （win32 vs windows 的归档名 + 落地名两处不一致），而当时的矩阵
        # 只有 ubuntu/macOS，这类问题只可能在发布后才暴露。
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - run: go vet ./...
      - name: gofmt
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt 认为以下文件未格式化："
            echo "$unformatted"
            exit 1
          fi
      - run: go test -race ./...

  # npm 侧单独跑，避免把 Go 的 3×3 矩阵再乘上 Node 版本。
  # Node 22 曾让 `node --test test/` 失败（把目录当模块解析），所以这里
  # 同时测 20/22/24，并固定用显式文件列表（Windows PowerShell 不展开 glob）。
  node-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: node --test test/asset-names.test.js test/wrapper.test.js test/gdx.test.js
