name: test

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        # Go 1.21/1.22 hit dyld "missing LC_UUID load command" on macOS 15
        # runners (golang/go#69910), so the oldest tested version is 1.23.
        go-version: ['1.23', '1.24', 'stable']
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - run: go test ./...
