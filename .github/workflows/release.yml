name: goreleaser

on:
  push:
    tags: ['v*']

# 权限按 job 最小化：npm-publish 不需要写 contents
permissions:
  contents: read

jobs:
  # 打 tag 先跑闸门。v1.8.0 就是"打 tag 直接构建发布"放出去的，
  # 当天暴露三个线上可见问题（Windows 装不上、--staged 计数恒 0、-h 丢说明）。
  # 这些都不是单元测试能覆盖的，但"发布前至少跑一遍全套检查"能拦住一部分。
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - run: go vet ./...
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt 认为以下文件未格式化："
            echo "$unformatted"
            exit 1
          fi
      - run: go test -race ./...
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test test/

  goreleaser:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          # 固定版本：'stable' 会让同一个 tag 在不同时间用不同工具链构建，
          # 产物不可复现
          go-version: '1.24.x'
      - uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npm-publish:
    needs: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # registry-url + NODE_AUTH_TOKEN 是 setup-node 支持的正式写法，
      # 不再 echo token 到 ~/.npmrc，也去掉了会打印配置的 Debug 步骤
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Update version in package.json
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          node -e "
            const pkg = require('./package.json');
            pkg.version = '$VERSION';
            require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # 端到端冒烟，分两段：
      #   1/2 直接用包里的 download-binary.js 拉真实 Release 资产——这一步不依赖
      #       npm registry 传播，确定性最高，正好覆盖 v1.8.0 那种"归档名/落地名
      #       不一致导致装完即挂"的问题；
      #   2/2 从 npm 装回来——这一步才验证发布出去的 tarball，但 registry 传播
      #       可能要几分钟（v1.8.2 首次跑时 90 秒内一直 ETARGET），所以先轮询。
      #       只把"5 分钟后仍看不到版本"当失败：那是真问题，不是传播延迟。
      - name: 冒烟 1/2：下载真实 Release 资产（不依赖 npm 传播）
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p /tmp/sp-smoke && cp index.js download-binary.js package.json /tmp/sp-smoke/
          cd /tmp/sp-smoke
          node -e "const fs=require('fs');const p=require('./package.json');p.version='$VERSION';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          node download-binary.js
          NAME=$(node -e "console.log(require('./download-binary.js').binaryNameFor(process.platform, process.arch))")
          test -x "./$NAME"
          ./"$NAME" --version | grep -q "$VERSION"
          ./"$NAME" -h | grep -q "Convenience shortcuts:"
          echo "✓ 下载 / 解压 / 落地名 / 可执行 / 用法说明 全部通过"

      - name: 冒烟 2/2：从 npm 装回来（先等 registry 传播）
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          ok=no
          for i in $(seq 1 20); do
            if npm view "sourcepack@$VERSION" version >/dev/null 2>&1; then ok=yes; break; fi
            echo "等 registry 传播 ${i}/20..."; sleep 15
          done
          if [ "$ok" != yes ]; then
            echo "::error::npm 上 5 分钟内仍看不到 $VERSION（不是传播延迟，需要人工确认）"
            exit 1
          fi
          npm install -g "sourcepack@$VERSION"
          sourcepack --version | grep -q "$VERSION"
          sourcepack -h | grep -q "Convenience shortcuts:"
          echo "✓ npm 安装路径通过"
